# General Window and Playback Behavior
title=${filename}
osd-playlist-entry=filename
keep-open=yes
save-position-on-quit=yes
watch-later-options=start
autofit=75%
keepaspect=yes

# App Identity
player-operation-mode=pseudo-gui
force-window=immediate

# Seeking performance & crash-proof responsiveness
hr-seek=default
hr-seek-framedrop=yes

# UI Decoupling (Required for uosc setup)
osc=no
osd-bar=no
border=no

# Advanced Video Pipeline
vo=gpu-next
gpu-api=d3d11
hwdec=auto-copy
hwdec-extra-frames=32
gpu-dumb-mode=no

# OLED True Black
target-colorspace-hint=yes
tone-mapping=clip
inverse-tone-mapping=no
dither-depth=10
dither=error-diffusion

# Debanding (libplacebo native — tuned for dark scene banding)
deband=yes
deband-iterations=4
deband-threshold=48
deband-range=16
deband-grain=16

# High-Quality Upscaling Filters
scale=ewa_lanczossharp
dscale=hermite
cscale=ewa_lanczossharp

# Color Tuning (neutral — no contrast/brightness lifting)
contrast=10
brightness=-4
saturation=0
gamma=0

# Volume
volume-max=200
