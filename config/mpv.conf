# General Window and Playback Behavior
title=${filename}
osd-playlist-entry=filename
keep-open=yes
save-position-on-quit=yes
watch-later-options=start
autofit=75%
keepaspect=yes

# App Identity
player-operation-mode=pseudo-gui
force-window=immediate

# Seeking performance & instant responsiveness
hr-seek=default
hr-seek-framedrop=yes
input-ar-delay=200
input-ar-rate=20
demuxer-max-bytes=300MiB
demuxer-max-back-bytes=150MiB
demuxer-readahead-secs=20
demuxer-lavf-buffersize=65536
vd-lavc-fast=yes
vd-lavc-threads=0

# UI Decoupling (Required for uosc setup)
osc=no
osd-bar=no
border=no

# Advanced Video Pipeline
vo=gpu-next
gpu-api=d3d11
hwdec=auto-safe
gpu-dumb-mode=no

# OLED True Black & HDR Dynamic Tone Mapping
target-colorspace-hint=yes
tone-mapping=auto
inverse-tone-mapping=no
dither-depth=auto
dither=fruit

# Debanding (libplacebo native — tuned for preserving fine textures while smoothing gradients)
deband=yes
deband-iterations=2
deband-threshold=24
deband-range=16
deband-grain=5

# High-Quality Sharp Scaling Pipeline (Crisp, artifact-free, zero GPU stalls)
scale=ewa_lanczossharp
scale-blur=0.98
scale-antiring=0.7
dscale=mitchell
dscale-antiring=0.7
cscale=spline36
sigmoid-upscaling=yes
correct-downscaling=yes
linear-downscaling=no
glsl-shaders-append="~~/shaders/CAS.glsl"

# Color Tuning (neutral — no contrast/brightness lifting)
contrast=10
brightness=-4
saturation=0
gamma=0

# Audio & Volume Architecture (Smooth, Zero-Lag, True 300% Scaling & Anti-Clipping)
volume-max=300
audio-channels=stereo
audio-normalize-downmix=no
af=lavfi=[acompressor=threshold=0.25:ratio=3:attack=15:release=150:makeup=2.0:knee=2.8,asoftclip=type=tanh:threshold=0.85:output=0.98]




