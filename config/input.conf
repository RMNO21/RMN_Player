# ==============================================================================
# RMN Player - Input Configuration (Dual English & Persian Layout Support)
# ==============================================================================

# Playback & Navigation
SPACE       cycle pause
ENTER       cycle fullscreen
ESC         set fullscreen no
RIGHT       no-osd seek  5 keyframes
LEFT        no-osd seek -5 keyframes
Shift+RIGHT no-osd seek 30 keyframes
Shift+LEFT  no-osd seek -30 keyframes
Ctrl+RIGHT  write-watch-later-config; playlist-next
Ctrl+LEFT   write-watch-later-config; playlist-prev

# Mouse Controls
MBTN_LEFT_DBL cycle fullscreen
MBTN_RIGHT    script-binding uosc/menu
WHEEL_UP      add volume 5
WHEEL_DOWN    add volume -5

# Volume & Audio
UP          add volume 5
DOWN        add volume -5
m           cycle mute
ئ           cycle mute
a           script-binding uosc/audio
ش           script-binding uosc/audio
x           add audio-delay -0.1
ط           add audio-delay -0.1
X           add audio-delay 0.1

# Subtitles
c           script-binding uosc/subtitles
ز           script-binding uosc/subtitles
v           cycle sub-visibility
ر           cycle sub-visibility
z           add sub-delay -0.1
ظ           add sub-delay -0.1
Z           add sub-delay 0.1

# Video & Visuals
V           script-binding uosc/video
b           script-message cycle-ambient-fill
ذ           script-message cycle-ambient-fill
d           cycle deband
ی           cycle deband
s           async screenshot
س           async screenshot
S           async screenshot video

# Playback Speed
[           add speed -0.1
]           add speed 0.1
\           set speed 1.0

# Looping (Cycle: Off -> Playlist -> One)
l           script-message cycle-loop
م           script-message cycle-loop
L           script-message cycle-loop

# uosc UI Triggers
`           script-binding uosc/menu
Tab         script-binding uosc/toggle-ui
f8          script-binding uosc/playlist
f9          script-binding uosc/chapters
o           script-binding uosc/open-file
خ           script-binding uosc/open-file
u           script-message open-url-menu
ع           script-message open-url-menu
