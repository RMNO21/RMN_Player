# General Window and Playback Behavior
title=${filename}
osd-playlist-entry=filename
keep-open=yes
save-position-on-quit=yes
watch-later-options=start
autofit=75%
keepaspect=yes

# App Identity
player-operation-mode=pseudo-gui
force-window=immediate

# Seeking performance & crash-proof responsiveness
hr-seek=no
hr-seek-framedrop=yes
fast-seeking=yes
input-ar-delay=200
input-ar-rate=20
demuxer-max-bytes=150MiB
demuxer-max-back-bytes=100MiB
demuxer-readahead-secs=5
vd-lavc-fast=yes

# UI Decoupling (Required for uosc setup)
osc=no
osd-bar=no
border=no

# Advanced Video Pipeline
vo=gpu-next
gpu-api=d3d11
hwdec=auto-copy
hwdec-extra-frames=64
vd-lavc-dr=no
gpu-dumb-mode=no

# OLED True Black
target-colorspace-hint=yes
tone-mapping=clip
inverse-tone-mapping=no
dither-depth=10
dither=fruit

# Debanding (libplacebo native — tuned for dark scene banding)
deband=yes
deband-iterations=2
deband-threshold=32
deband-range=16
deband-grain=8

# High-Quality Upscaling Filters (Smooth, responsive, zero GPU stalls)
scale=spline36
dscale=hermite
cscale=spline36

# Color Tuning (neutral — no contrast/brightness lifting)
contrast=10
brightness=-4
saturation=0
gamma=0

# Volume
volume-max=200
