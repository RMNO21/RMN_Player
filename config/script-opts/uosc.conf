# Interface Style & Sizing
timeline_style=bar
timeline_size=24
timeline_persistency=
timeline_border=0
timeline_cache=true
timeline_heatmap=overlay
controls_size=34
controls_margin=8
controls_spacing=3
controls_persistency=
autohide=yes
window_border_size=0
border_radius=4
animation_duration=120
pause_indicator=flash
destination_time=playtime-remaining
time_precision=0
menu_item_height=36
menu_min_width=280
menu_padding=4

# Top Bar Configuration
top_bar=no-border
top_bar_size=38
top_bar_persistency=playback
top_bar_title=${filename}
top_bar_alt_title=

# Controls Layout
controls=menu,open-file,gap,prev,play-pause,next,gap,<video,audio>subtitles,<has_many_audio>audio,<has_many_video>video,<chapters>chapters,space,shuffle,loop,gap,fullscreen
