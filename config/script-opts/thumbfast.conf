# thumbfast.conf - Thumbnail preview configuration

# Spawn thumbnailer on file load for faster initial thumbnails
spawn_first=yes

# Use native Windows API for pipe communication (configured dynamically on Windows)
direct_io=no

# Thumbnail size
max_height=200
max_width=200

# Disable hardware decoding in thumbnail subprocess (avoids conflicts with main mpv)
hwdec=no

# Enable on network playback
network=yes

# Enable on audio playback
audio=yes

# Never quit thumbnailer - keeps it ready for instant previews
quit_after_inactivity=0

# Tone mapping for HDR content
tone_mapping=auto

# Path to mpv executable (set dynamically by installer)
mpv_path=mpv
